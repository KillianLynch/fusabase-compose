services:
  fusabase_db:
    image: container-registry.oracle.com/database/free:23.26.3.0
    container_name: fusabase_db
    hostname: fusabase_db
    ports:
      - 1521:1521
      - 8080:8080 # ORDS HTTP (shared network)
      - 27017:27017 # MongoDB API (shared network)
    environment:
      - ORACLE_PASSWORD=Welcome12345
    volumes:
      - ./oracle:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD-SHELL", "lsnrctl status | grep READY"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  fusabase_ords: # more info: https://container-registry.oracle.com/ords/ocr/ba/database/ords
    image: container-registry.oracle.com/database/ords:26.3.0
    container_name: fusabase_ords
    network_mode: "service:fusabase_db"
    depends_on:
      fusabase_db:
        condition: service_healthy
    environment:
      - CONN_STRING=jdbc:oracle:thin:@localhost:1521/freepdb1
      - ORACLE_PWD=Welcome12345
      - ORACLE_USER_PWD=Welcome12345
    volumes:
      - ./ords_config:/etc/ords/config
      - ./ords_entrypoint.d:/ords-entrypoint.d:ro
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo 'EXECUTE ORDS.ENABLE_SCHEMA;' | sql -s testuser/testpwd@localhost:1521/freepdb1" ]
      interval: 20s
      timeout: 10s
      retries: 5
